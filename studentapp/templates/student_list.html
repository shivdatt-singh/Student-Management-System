{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
    <h1>Student List</h1>
  
    
<table>
    <tr>
        <th>Name</th>
        <th>Roll Number</th>
        <th>Email</th>
        <th>Age</th>
        <th>Actions</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.roll_number }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.age }}</td>
        <td>
          <a class="update-btn" href="{% url 'update_student' student.id %}">Update</a>

            <form method="POST" action="{% url 'delete_student' student.id %}">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

       

    
<h2>Add Student</h2>

<form method="POST" class="student-form">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Roll Number:</label>
    <input type="number" name="roll_number" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Age:</label>
    <input type="number" name="age" required>
    <br><br>

   <button type="submit" class="add-btn">Add Student</button>
</form>
<hr>
</div>

</body>
</html>
