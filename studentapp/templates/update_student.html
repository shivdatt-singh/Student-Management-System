<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Update Student</title>
</head>
<body>
    <h1>Update Student Details </h1>
    
{% if form.errors %}
    <div style="color: red;">
        {% for field, errors in form.errors.items %}
            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        {% endfor %}
    </div>
{% endif %}

    <form method="POST">
        {% csrf_token %}
        <lable>Name:</lable>
        <input type="text0" name ="name" value = "{{student.name}}" required >
        <br><br>

        
<label>Roll Number:</label>
<input type="number" name="roll_number" value="{{ student.roll_number }}" required>
<br><br>

<label>Email:</label>
<input type="email" name="email" value="{{ student.email }}" required>
<br><br>

<label>Age:</label>
<input type="number" name="age" value="{{ student.age }}" required>
<br><br>

<button type="submit">Save Changes</button>

    </form>
</body>
</html>
